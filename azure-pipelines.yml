trigger:
  - main

pool:
  vmImage: 'ubuntu-24.04'

steps:
  - script: |
      docker --version
      echo "Checked Docker version"
    displayName: 'Checking Docker Version'

  - script: |
      sudo systemctl status docker
      python helloworld.py
      echo "Checking Docker Engine Status " 
    displayName: 'Checking Docker Engine Status'

  - script: |
      docker build -t my-python-app .
      echo "Docker Image Built Successfully"
    displayName: 'Building Docker Image'  
    
  - script: |
      docker images 
      echo "Listing Docker Images" 
    displayName: 'Docker Image Listing'   

  - script: |
      docker run my-python-app
      echo "Running Docker Container"    
    displayName: 'Running Docker Container'

  - script: |
      docker container ls 
      echo "Listing Docker Containers"
    displayName: 'Docker Container Listing'